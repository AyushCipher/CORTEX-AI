name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-agent:
    name: Agent Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/services/agent/package-lock.json

      - name: Install backend root dependencies
        run: npm ci
        working-directory: backend

      - name: Install agent dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          GOOGLE_API_KEY: "dummy-key-for-tests"
          GROQ_API_KEY: "dummy-key-for-tests"
          OPENROUTER_API_KEY: "dummy-key-for-tests"
          TAVILY_API_KEY: "dummy-key-for-tests"
          INTERNAL_SERVICE_SECRET: "dummy-internal-secret"
          REDIS_URL: "redis://localhost:6379"

  backend-auth:
    name: Auth Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/auth
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/services/auth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          INTERNAL_SERVICE_SECRET: "dummy-internal-secret"

  backend-billing:
    name: Billing Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/billing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/services/billing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          INTERNAL_SERVICE_SECRET: "dummy-internal-secret"

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
